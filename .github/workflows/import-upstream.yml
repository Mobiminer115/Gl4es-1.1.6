name: Import GL4ES v1.1.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !hashFiles('.gl4es-imported') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import upstream GL4ES v1.1.6
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch v1.1.6 https://github.com/ptitSeb/gl4es.git "$tmp/gl4es"
          rm -rf ./* ./.??* 2>/dev/null || true
          cp -a "$tmp/gl4es"/. .
          rm -rf .git
          touch .gl4es-imported
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import upstream GL4ES v1.1.6"
          git branch -M main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
